name: Telegram Notification Bot

on: [push, pull_request]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Parse GitHub Event and Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: python
        run: |
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          # Load secret credentials from GitHub settings
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          event_path = os.environ.get("GITHUB_EVENT_PATH")

          if not token or not chat_id or not event_path:
              print("Error: Missing environment tokens or event path.")
              exit(1)

          # Read the raw push payload event provided by GitHub
          with open(event_path, "r") as f:
              payload = json.load(f)

          # Extract git metadata
          repo_name = payload.get("repository", {}).get("name", "Unknown Repo")
          pusher = payload.get("pusher", {}).get("name", "Someone")
          ref = payload.get("ref", "refs/heads/main").split("/")[-1]

          # Commit time in Cambodia time zone (UTC+7), formatted hh:mm:ss
          cambodia_tz = timezone(timedelta(hours=7))
          commit_time = datetime.now(cambodia_tz).strftime("%H:%M:%S")

          # Format Markdown Message
          message = f"🚀 *New Push to {repo_name} {ref}*\n"
          message += f"👤 *By:* {pusher}\n\n"
          message += "📝 *Commits:*\n"

          # Grab up to the last 5 commits
          commits = payload.get("commits", [])[:5]
          for commit in commits:
              msg = commit.get("message", "No message").split('\n')[0]
              author = commit.get("author", {}).get("name", "Unknown")
              message += f"• {msg} (- {author})\n"

          # Append the commit time (Cambodia time zone)
          message += f"\n🕒 *Time:* {commit_time}"

          # Send data via direct HTTP request to Telegram API
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          body = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown"
          }).encode("utf-8")

          req = urllib.request.Request(
              url, 
              data=body, 
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print("Success! Notification delivered to Telegram.")
          except Exception as e:
              print(f"Failed to transmit message: {e}")
